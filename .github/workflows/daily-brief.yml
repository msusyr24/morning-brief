name: Generate Daily Brief

on:
  schedule:
    # 03:17 UTC = 05:17 in Romania (winter) / 06:17 (summer)
    - cron: "17 3 * * *"
  workflow_dispatch:  # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python brief.py

      - name: Save run files for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_number }}
          path: |
            brief.html
            raw_stories.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit and push brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in brief.html raw_stories.txt seen.json suggestions_state.json; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --staged --quiet && exit 0
          git commit -m "Daily brief: $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
