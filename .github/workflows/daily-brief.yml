name: Generate Daily Brief

on:
  schedule:
    # Backup only. GitHub runs this ~8h late, so a Claude scheduled task
    # starts the brief at ~04:45 Romania time via workflow_dispatch.
    # If that brief already exists today, this backup run skips itself.
    - cron: "17 3 * * *"
  workflow_dispatch:  # manual run, and the early-morning scheduled task

permissions:
  contents: write
  issues: write  # read + close "Brief feedback" issues (thumbs up/down votes)

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Skip backup run if today's brief exists
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             git log --since="20 hours ago" --format=%s | grep -q "^Daily brief: $(date -u +'%Y-%m-%d')"; then
            echo "Today's brief already exists — skipping backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate brief
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BRIEF_LAT: ${{ secrets.BRIEF_LAT }}
          BRIEF_LON: ${{ secrets.BRIEF_LON }}
          BRIEF_PLACE: ${{ secrets.BRIEF_PLACE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python brief.py

      - name: Save run files for debugging
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_number }}
          path: |
            brief.html
            raw_stories.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit and push brief
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in brief.html index.html archive raw_stories.txt seen.json suggestions_state.json feedback.json stoic_cache; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --staged --quiet && exit 0
          git commit -m "Daily brief: $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
